# ============================================================
# VirtualHost para jacksrock.com (servido vía Cloudflare Tunnel → localhost:80)
# ------------------------------------------------------------
# Instalar en el servidor Ubuntu:
#   sudo cp deploy/apache-jacksrock.conf /etc/apache2/sites-available/jacksrock.conf
#   sudo a2ensite jacksrock.conf
#   sudo a2enmod rewrite
#   sudo a2dissite 000-default.conf      # opcional: desactiva el sitio por defecto
#   sudo systemctl reload apache2
#
# Ajusta DocumentRoot si la app NO está en /var/www/html/jacks-rock
# ============================================================
<VirtualHost *:80>
    ServerName jacksrock.com
    ServerAlias www.jacksrock.com

    DocumentRoot /var/www/html/jacks-rock

    <Directory /var/www/html/jacks-rock>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Cloudflare entrega la IP real del visitante en este header (informativo)
    # Requiere: sudo a2enmod remoteip  (opcional)
    # RemoteIPHeader CF-Connecting-IP

    ErrorLog  ${APACHE_LOG_DIR}/jacksrock-error.log
    CustomLog ${APACHE_LOG_DIR}/jacksrock-access.log combined
</VirtualHost>
